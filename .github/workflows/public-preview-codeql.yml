name: Public preview Swift security

'on':
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: public-preview-codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    # CodeQL cannot trace builds on macOS 27 or Xcode 27, so this job alone uses Xcode 26.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      JOESPROXY_PREVIEW_XCODE_VERSION: '26.6'
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate workflow policy
        run: ruby memlog/utility_scripts/public_preview_security.rb workflows
      - name: Download locked packages
        run: bash memlog/utility_scripts/public_preview_build.sh resolve
      - name: Initialize Swift extraction
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build the app under extraction
        run: bash memlog/utility_scripts/public_preview_build.sh build
      - name: Build and test the companion SDK under extraction
        run: bash memlog/utility_scripts/public_preview_build.sh sdk
      - name: Analyze Swift
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:swift
