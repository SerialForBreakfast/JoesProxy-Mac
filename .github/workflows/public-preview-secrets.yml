name: Public preview secret scan

'on':
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '41 8 * * 1'

permissions:
  contents: read

concurrency:
  group: public-preview-secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate workflow policy
        run: ruby memlog/utility_scripts/public_preview_security.rb workflows
      - name: Fetch the pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Tools
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output build/Tools/gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            build/Tools/gitleaks.tar.gz | sha256sum --check --strict
          tar -xzf build/Tools/gitleaks.tar.gz -C build/Tools gitleaks
      - name: Scan and verify reviewed exceptions
        env:
          GITLEAKS_BIN: ./build/Tools/gitleaks
        run: bash memlog/utility_scripts/public_preview_secret_scan.sh
      - name: Retain content-free scan summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-preview-secret-summary
          path: build/PublicPreview/evidence/secret-summary.json
          retention-days: 3
          if-no-files-found: error
